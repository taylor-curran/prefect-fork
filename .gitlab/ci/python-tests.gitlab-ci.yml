# ===========================================================================
# Docker Tests — postgres x Python versions (separate job from unit tests)
# ===========================================================================
docker-tests:
  stage: test
  image: python:${PYTHON_VERSION}
  interruptible: true
  resource_group: docker-tests-$CI_COMMIT_REF_SLUG
  timeout: 45 minutes
  services:
    - docker:dind
  variables:
    PY_COLORS: "1"
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules: !reference [.python-test-rules, rules]
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12"]
        DATABASE_IMAGE: ["postgres:14"]
  before_script:
    - pip install uv
    # Set up Docker Buildx
    - docker buildx create --use --driver docker-container --driver-opt image=moby/buildkit:v0.12.5 || true
    # Get image tag
    - SHORT_SHA=$(git rev-parse --short=7 HEAD)
    - IMAGE_TAG="sha-${SHORT_SHA}-python${PYTHON_VERSION}"
    - NODE_VERSION=$(cat .nvmrc)
    # Login to DockerHub (only for internal MRs)
    - |
      if [ -n "$DOCKERHUB_USERNAME" ] && [ -n "$DOCKERHUB_TOKEN" ]; then
        docker login -u "$DOCKERHUB_USERNAME" -p "$DOCKERHUB_TOKEN"
      fi
    # Build test Docker image
    - |
      docker buildx build \
        --build-arg PYTHON_VERSION=${PYTHON_VERSION} \
        --build-arg "PREFECT_EXTRAS=[dev]" \
        --build-arg NODE_VERSION=${NODE_VERSION} \
        --tag prefecthq/prefect-dev:${IMAGE_TAG} \
        --output type=docker,dest=/tmp/image.tar \
        .
    - docker load --input /tmp/image.tar
    - docker run --rm prefecthq/prefect-dev:${IMAGE_TAG} prefect version
    # Install packages and start services
    - uv sync --locked
    - *postgres-setup
    # Start docker registry
    - docker run --name "prefect-test-registry" --detach --publish 5555:5000 registry:2
    # Start redis
    - docker run --name redis --detach --publish 6379:6379 redis:latest || true
  script:
    - git diff --exit-code
    - |
      uv run pytest tests --ignore=tests/typesafety \
        --numprocesses auto \
        --maxprocesses 6 \
        --dist worksteal \
        --disable-docker-image-builds \
        --only-service docker \
        --durations 26
  after_script:
    - docker container inspect postgres && docker container logs postgres || echo "Ignoring bad exit code"
  cache:
    key: docker-tests-${PYTHON_VERSION}-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/uv

# ===========================================================================
# Typesafety Tests
# ===========================================================================
typesafety-tests:
  stage: test
  image: python:3.12
  interruptible: true
  rules: !reference [.python-test-rules, rules]
  variables:
    PY_COLORS: "1"
  before_script:
    - pip install uv
  script:
    - uv sync --locked
    - uv run pytest tests/typesafety --disable-docker-image-builds
  cache:
    key: typesafety-py312-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/uv
