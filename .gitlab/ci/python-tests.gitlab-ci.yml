# Converted from .github/workflows/python-tests.yaml
#
# Original triggers: pull_request + push to main with path filters
# Original concurrency: group by workflow + branch, cancel-in-progress on PRs
# Original matrix: test-type x database x python-version with excludes
#
# GitLab's parallel:matrix does not support `exclude`, so the matrix is split
# into separate job definitions:
#   - Server / DB+Orch tests: run on both postgres and sqlite for all Python versions
#   - Client tests: run only on postgres (excluded from sqlite in GH Actions)
#   - Runner/Worker/Settings/Input/CLI tests: run only on postgres (excluded from sqlite)

# ---------------------------------------------------------------------------
# Common configuration anchors
# ---------------------------------------------------------------------------
.python-test-rules:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - .gitlab/ci/python-tests.gitlab-ci.yml
        - "src/prefect/**/*.py"
        - "tests/**/*.py"
        - pyproject.toml
        - Dockerfile
        - scripts/entrypoint.sh
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - .gitlab/ci/python-tests.gitlab-ci.yml
        - "src/prefect/**/*.py"
        - "tests/**/*.py"
        - pyproject.toml
        - Dockerfile
        - scripts/entrypoint.sh

.python-test-base:
  stage: test
  interruptible: true
  resource_group: unit-tests-$CI_COMMIT_REF_SLUG
  timeout: 15 minutes
  variables:
    PY_COLORS: "1"
  before_script:
    - pip install uv
    - uv sync --locked
    # Start redis
    - docker run --name redis --detach --publish 6379:6379 redis:latest || true
  cache:
    key: python-tests-${PYTHON_VERSION}-${CI_COMMIT_REF_SLUG}
    paths:
      - .cache/uv

# ---------------------------------------------------------------------------
# Helper: Postgres setup script (used in before_script)
# ---------------------------------------------------------------------------
.postgres-setup: &postgres-setup
  - |
    docker run \
      --name "postgres" \
      --detach \
      --health-cmd pg_isready \
      --health-interval 10s \
      --health-timeout 5s \
      --health-retries 5 \
      --publish 5432:5432 \
      --tmpfs /var/lib/postgresql/data \
      --env POSTGRES_USER="prefect" \
      --env POSTGRES_PASSWORD="prefect" \
      --env POSTGRES_DB="prefect" \
      --env LANG="C.UTF-8" \
      --env LANGUAGE="C.UTF-8" \
      --env LC_ALL="C.UTF-8" \
      --env LC_COLLATE="C.UTF-8" \
      --env LC_CTYPE="C.UTF-8" \
      ${DATABASE_IMAGE} \
      -c max_connections=250
  - ./scripts/wait-for-healthy-container.sh postgres 30
  - export PREFECT_SERVER_DATABASE_CONNECTION_URL="postgresql+asyncpg://prefect:prefect@localhost/prefect"

# ===========================================================================
# Server Tests — postgres & sqlite x all Python versions
# ===========================================================================
server-tests:
  extends: .python-test-base
  rules: !reference [.python-test-rules, rules]
  image: python:${PYTHON_VERSION}
  services:
    - docker:dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  parallel:
    matrix:
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        DATABASE_IMAGE: ["postgres:14"]
      - PYTHON_VERSION: ["3.9", "3.10", "3.11", "3.12", "3.13"]
        DATABASE_IMAGE: ["sqlite"]
  before_script:
    - pip install uv
    - uv sync --locked
    - docker run --name redis --detach --publish 6379:6379 redis:latest || true
    - |
      if [ "$DATABASE_IMAGE" != "sqlite" ]; then
        docker run \
          --name "postgres" \
          --detach \
          --health-cmd pg_isready \
          --health-interval 10s \
          --health-timeout 5s \
          --health-retries 5 \
          --publish 5432:5432 \
          --tmpfs /var/lib/postgresql/data \
          --env POSTGRES_USER="prefect" \
          --env POSTGRES_PASSWORD="prefect" \
          --env POSTGRES_DB="prefect" \
          --env LANG="C.UTF-8" \
          --env LANGUAGE="C.UTF-8" \
          --env LC_ALL="C.UTF-8" \
          --env LC_COLLATE="C.UTF-8" \
          --env LC_CTYPE="C.UTF-8" \
          ${DATABASE_IMAGE} \
          -c max_connections=250
        ./scripts/wait-for-healthy-container.sh postgres 30
        export PREFECT_SERVER_DATABASE_CONNECTION_URL="postgresql+asyncpg://prefect:prefect@localhost/prefect"
      fi
  script:
    - |
      uv run pytest tests/server/ tests/events/server \
        --ignore=tests/server/database/ \
        --ignore=tests/server/orchestration/ \
        --numprocesses auto \
        --maxprocesses 6 \
        --dist worksteal \
        --disable-docker-image-builds \
        --exclude-service kubernetes \
        --exclude-service docker \
        --durations 26
  after_script:
    - docker container inspect postgres && docker container logs postgres || echo "Ignoring bad exit code"

