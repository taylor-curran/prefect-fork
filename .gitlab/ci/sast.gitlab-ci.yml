# Converted from .github/workflows/codeql-analysis.yml
#
# Original: CodeQL analysis for JavaScript and Python
# GitLab equivalent: Built-in SAST template
#
# The GitLab SAST template auto-detects languages and runs appropriate
# analyzers (semgrep for Python/JS/TS, etc.)
#
# Original triggers: push to main, PR to main (path-filtered), weekly schedule

include:
  - template: Security/SAST.gitlab-ci.yml

# Override the default sast job to add custom rules matching the original workflow
sast:
  stage: security
  interruptible: true
  rules:
    # Push to main
    - if: $CI_COMMIT_BRANCH == "main"
    # Merge requests targeting main with relevant file changes
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_MERGE_REQUEST_TARGET_BRANCH_NAME == "main"
      changes:
        - "**/*.py"
        - "**/*.js"
        - "**/*.ts"
        - pyproject.toml
        - alembic.ini
    # Weekly schedule (equivalent to cron: "30 20 * * 0")
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    SAST_EXCLUDED_ANALYZERS: ""
    SEARCH_MAX_DEPTH: 20
