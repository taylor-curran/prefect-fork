# Converted from .github/workflows/time-docker-build.yaml
#
# Original triggers: push to main (Dockerfile/.dockerignore), pull_request (same paths)
# Benchmarks Docker build times and compares PR branch vs base branch.

docker-build-benchmark:
  stage: build
  image: docker:24-cli
  services:
    - docker:24-dind
  interruptible: true
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - Dockerfile
        - .dockerignore
    - if: $CI_COMMIT_BRANCH == "main"
      changes:
        - Dockerfile
        - .dockerignore
  before_script:
    - apk add --no-cache bash git bc
    # Set up QEMU for multi-arch builds
    - docker run --rm --privileged multiarch/qemu-user-static --reset -p yes
    # Set up Docker Buildx
    - docker buildx create --use --driver docker-container
  script:
    - |
      set -euo pipefail

      # --- For MRs, build the base (target) branch first ---
      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        echo "Checking out base branch: ${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
        git fetch origin "${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"
        git checkout "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}"

        # Clean Docker system
        docker system prune -af
        docker builder prune -af

        echo "Building base branch image..."
        start_time=$(date +%s)
        docker buildx build \
          --platform linux/amd64,linux/arm64 \
          --no-cache \
          --progress=plain \
          .
        end_time=$(date +%s)
        BASE_TIME=$((end_time - start_time))
        echo "Base branch build time: ${BASE_TIME}s"

        # Switch back to the MR source branch
        git checkout "${CI_COMMIT_SHA}"
      fi

      # Clean Docker system
      docker system prune -af
      docker builder prune -af

      # --- Build current branch ---
      echo "Building current branch image..."
      start_time=$(date +%s)
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --no-cache \
        --progress=plain \
        .
      end_time=$(date +%s)
      CURRENT_TIME=$((end_time - start_time))
      echo "Current branch build time: ${CURRENT_TIME}s"

      # --- Generate comparison report ---
      mkdir -p build-report

      if [ "$CI_PIPELINE_SOURCE" = "merge_request_event" ]; then
        DIFF=$((CURRENT_TIME - BASE_TIME))
        PERCENT=$(echo "scale=2; ($CURRENT_TIME - $BASE_TIME) * 100 / $BASE_TIME" | bc)

        if [ $DIFF -gt 0 ]; then
          DIFF_TEXT="+${DIFF}s (+${PERCENT}%)"
        elif [ $DIFF -lt 0 ]; then
          DIFF_TEXT="${DIFF}s (${PERCENT}%)"
        else
          DIFF_TEXT="No change"
        fi

        cat > build-report/docker-build-time.txt <<EOF
      Docker Build Time Comparison
      ============================
      Base branch (${CI_MERGE_REQUEST_TARGET_BRANCH_NAME}): ${BASE_TIME}s
      Current branch (${CI_MERGE_REQUEST_SOURCE_BRANCH_NAME}): ${CURRENT_TIME}s
      Difference: ${DIFF_TEXT}
      EOF

        echo "--- Docker Build Time Comparison ---"
        echo "Base: ${BASE_TIME}s | Current: ${CURRENT_TIME}s | Diff: ${DIFF_TEXT}"

        # Fail if build time increased by more than 5%
        if (( $(echo "$PERCENT > 5" | bc -l) )); then
          echo "ERROR: Build time increased by more than 5%! Please review the Dockerfile changes."
          exit 1
        elif (( $(echo "$PERCENT < 0" | bc -l) )); then
          echo "Build time decreased! Great job optimizing the build!"
        fi
      else
        cat > build-report/docker-build-time.txt <<EOF
      Docker Build Time
      =================
      Build completed in ${CURRENT_TIME} seconds
      EOF

        echo "Build completed in ${CURRENT_TIME} seconds"
      fi
  artifacts:
    paths:
      - build-report/
    when: always
    expire_in: 30 days
