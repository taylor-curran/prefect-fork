# GitLab CI/CD Configuration for Prefect
# Converted from GitHub Actions workflows
#
# Required CI/CD Variables (set in GitLab project settings as masked variables):
#   - DOCKERHUB_USERNAME
#   - DOCKERHUB_TOKEN
#   - OPS_CLUSTER_DEPLOYMENT_ACTIONS_RW (for triggering downstream pipelines)

stages:
  - static-analysis
  - test
  - security
  - build
  - docker-publish
  - downstream

# Default settings applied to all jobs
default:
  interruptible: true

# Global workflow rules: run on merge requests, pushes to main, tags, and schedules
workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_COMMIT_TAG
    - if: $CI_PIPELINE_SOURCE == "schedule"
    - if: $CI_PIPELINE_SOURCE == "web"  # manual pipeline triggers (workflow_dispatch equivalent)

include:
  - local: '.gitlab/ci/static-analysis.gitlab-ci.yml'
  - local: '.gitlab/ci/python-tests.gitlab-ci.yml'
  - local: '.gitlab/ci/markdown-tests.gitlab-ci.yml'
  - local: '.gitlab/ci/docker-images.gitlab-ci.yml'
  - local: '.gitlab/ci/time-docker-build.gitlab-ci.yml'
  - local: '.gitlab/ci/sast.gitlab-ci.yml'
